<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Without Love…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e4e2ea;
    --bg-edge: #cfcbd8;
    --warm: #94430f;
    --warm-soft: #b8612a;
    --cold: #8a8e9b;
    --muted: #6d6a78;
    --glow: 214, 128, 54;
    --mote: 120, 118, 135;
    --blend: source-over;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0c1b; --bg-edge: #05040b;
      --warm: #ffd8a1; --warm-soft: #ffb877;
      --cold: #4c5366; --muted: #7d7a93;
      --glow: 255, 168, 92; --mote: 120, 128, 156;
      --blend: lighter;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0c1b; --bg-edge: #05040b;
    --warm: #ffd8a1; --warm-soft: #ffb877;
    --cold: #4c5366; --muted: #7d7a93;
    --glow: 255, 168, 92; --mote: 120, 128, 156;
    --blend: lighter;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, var(--bg) 40%, var(--bg-edge) 100%);
    background-color: var(--bg);
    font-family: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--cold);
    touch-action: none; user-select: none; -webkit-user-select: none;
    cursor: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .stage {
    position: relative; height: 100%;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: clamp(1rem, 3vh, 2.2rem) clamp(1rem, 4vw, 3rem);
  }
  header { text-align: center; }
  h1 {
    margin: 0; font-weight: 300; font-style: italic;
    font-size: clamp(1.1rem, 2.2vw, 1.5rem); letter-spacing: .04em;
    color: var(--muted);
  }
  .hint {
    margin: .35rem 0 0; font-size: clamp(.95rem, 1.6vw, 1.1rem);
    color: var(--muted); transition: opacity 2.5s ease;
  }
  .hint.gone { opacity: 0; }

  #field {
    align-self: center; justify-self: center;
    max-width: 68rem; width: 100%;
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: clamp(.4rem, 2.2vh, 1.6rem) clamp(.9rem, 3.4vw, 3rem);
  }
  .w {
    display: grid; place-items: center;
    font-size: calc(clamp(1.35rem, 3.6vw, 3.1rem) * var(--s, 1));
    line-height: 1.1;
    transform: translateY(var(--dy, 0));
    will-change: transform;
  }
  .w > span { grid-area: 1 / 1; white-space: nowrap; will-change: opacity, filter; }
  .v {
    font-weight: 500; color: var(--warm);
    text-shadow: 0 0 .6em rgba(var(--glow), .45);
    opacity: 0;
  }
  .d {
    font-style: italic; font-weight: 300; color: var(--cold);
    letter-spacing: .06em;
  }

  footer { text-align: center; min-height: 4.6em; }
  #line {
    margin: 0 auto; max-width: 34em;
    font-size: clamp(1.15rem, 2.4vw, 1.7rem); font-weight: 400;
    color: var(--muted);
    transition: opacity .7s ease, filter .7s ease;
  }
  #line.swap { opacity: 0; filter: blur(4px); }
  #line b { font-weight: 500; transition: color 1s ease; }
  #line i { color: var(--warm-soft); font-style: italic; }
  #line .on { color: var(--warm); }
  #line .off { color: var(--cold); }
  .by { margin: .5rem 0 0; font-size: .95rem; font-style: italic; color: var(--muted); opacity: .8; }

  @media (hover: none) { body { cursor: default; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="stage">
  <header>
    <h1>Without Love…</h1>
    <p class="hint" id="hint">Carry the light across the words. Press and hold to love everything.</p>
  </header>
  <main id="field" aria-label="Thirteen virtues and what they become without love"></main>
  <footer>
    <p id="line" aria-live="polite"></p>
    <p class="by">attributed to Lao Tzu</p>
  </footer>
</div>

<script>
(() => {
  const DATA = [
    ["Duty","irritation"],["Responsibility","disrespect"],["Justice","harshness"],
    ["Truth","brutality"],["Education","pedantry"],["Wisdom","cunning"],
    ["Kindness","hypocrisy"],["Order","pettiness"],["Knowledge","dogma"],
    ["Power","violence"],["Honour","arrogance"],["Possession","stinginess"],
    ["Faith","fanaticism"]
  ];
  const SIZES = [1.05,.82,1.2,1.45,.9,1.25,1,.88,1.12,1.38,.98,.84,1.3];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const field = document.getElementById("field");
  const lineEl = document.getElementById("line");
  const hint = document.getElementById("hint");
  const words = DATA.map(([v, d], i) => {
    const el = document.createElement("div");
    el.className = "w";
    el.style.setProperty("--s", SIZES[i]);
    el.style.setProperty("--dy", ((i * 37) % 9 - 4) * 0.12 + "em");
    el.innerHTML = `<span class="v">${v}</span><span class="d">${d}</span>`;
    el.setAttribute("aria-label", `${v} without love is ${d}`);
    field.appendChild(el);
    return { v, d, el, vs: el.children[0], ds: el.children[1], x: 0, y: 0, f: 0, seed: Math.random() * 6.28 };
  });

  // ----- canvas -----
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1, theme = {};
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    theme.glow = cs.getPropertyValue("--glow").trim();
    theme.mote = cs.getPropertyValue("--mote").trim();
    theme.blend = cs.getPropertyValue("--blend").trim() || "source-over";
    theme.dark = theme.blend === "lighter";
  }
  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    words.forEach(w => {
      const r = w.el.getBoundingClientRect();
      w.x = r.left + r.width / 2; w.y = r.top + r.height / 2;
    });
  }
  readTheme(); layout();
  addEventListener("resize", layout);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTheme);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

  // drifting motes: ash in the cold, embers near the light
  const MOTES = reduce ? 40 : Math.round(Math.min(160, (W * H) / 9000));
  const motes = Array.from({ length: MOTES }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - .5) * .15, vy: (Math.random() - .5) * .15,
    r: Math.random() * 1.4 + .4, ph: Math.random() * 6.28, heat: 0
  }));
  const sparks = [];

  // ----- the light -----
  const light = { x: W / 2, y: H / 2, tx: W / 2, ty: H / 2 };
  let lastInput = -1e9, holding = false, hold = 0, interacted = false;

  function onMove(e) {
    light.tx = e.clientX; light.ty = e.clientY;
    lastInput = performance.now();
    if (!interacted) { interacted = true; setTimeout(() => hint.classList.add("gone"), 1800); }
  }
  addEventListener("pointermove", onMove);
  addEventListener("pointerdown", e => { onMove(e); holding = true; });
  addEventListener("pointerup", () => holding = false);
  addEventListener("pointercancel", () => holding = false);
  addEventListener("blur", () => holding = false);
  addEventListener("keydown", e => { if (e.code === "Space") { holding = true; e.preventDefault(); } });
  addEventListener("keyup", e => { if (e.code === "Space") holding = false; });

  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // ----- caption -----
  let current = -1, swapTimer = 0;
  function setLine(i) {
    if (i === current) return;
    current = i;
    lineEl.classList.add("swap");
    clearTimeout(swapTimer);
    swapTimer = setTimeout(() => {
      const w = words[i];
      lineEl.innerHTML = `<b class="a">${w.v}</b> without <i>love</i> is <b class="b">${w.d}</b>`;
      lineEl.classList.remove("swap");
    }, 450);
  }

  // ----- loop -----
  function frame(t) {
    const idle = t - lastInput > 3800;
    if (idle) {
      // the light wanders on its own, slowly visiting the words
      const s = reduce ? 0.4 : 1;
      light.tx = W / 2 + Math.sin(t * .00017 * s) * W * .36 + Math.sin(t * .00041 * s + 2) * W * .07;
      light.ty = H * .48 + Math.sin(t * .00026 * s + 1) * H * .24 + Math.cos(t * .00063 * s) * H * .05;
    }
    const ease = idle ? .02 : .14;
    light.x += (light.tx - light.x) * ease;
    light.y += (light.ty - light.y) * ease;

    hold += ((holding ? 1 : 0) - hold) * (holding ? .025 : .04);
    const base = Math.max(120, Math.min(W, H) * .24);
    const R = base + hold * Math.hypot(W, H);

    // words
    let near = 0, nd = Infinity;
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      const dist = Math.hypot(w.x - light.x, w.y - light.y);
      if (dist < nd) { nd = dist; near = i; }
      const target = 1 - smooth(R * .28, R, dist);
      w.f += (target - w.f) * .09;
      const f = w.f;
      const breathe = reduce ? 0 : Math.sin(t * .0011 + w.seed) * .6;
      w.vs.style.opacity = f.toFixed(3);
      w.vs.style.filter = `blur(${((1 - f) * 7).toFixed(2)}px)`;
      w.ds.style.opacity = ((1 - f) * .92).toFixed(3);
      w.ds.style.filter = `blur(${(f * 7).toFixed(2)}px)`;
      w.el.style.transform = `translateY(calc(var(--dy) + ${(breathe * (1 - f)).toFixed(2)}px)) scale(${(1 + f * .06).toFixed(4)})`;
    }
    setLine(near);
    const nf = words[near].f;
    const a = lineEl.querySelector(".a"), b = lineEl.querySelector(".b");
    if (a && b) { a.className = "a " + (nf > .5 ? "on" : "off"); b.className = "b " + (nf > .5 ? "off" : "on"); }

    // canvas
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = theme.blend;
    const g = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, R * 1.15);
    const ga = theme.dark ? .22 : .16;
    g.addColorStop(0, `rgba(${theme.glow},${ga + hold * .05})`);
    g.addColorStop(.35, `rgba(${theme.glow},${ga * .35})`);
    g.addColorStop(1, `rgba(${theme.glow},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // the flame itself
    const flick = reduce ? 1 : 1 + Math.sin(t * .013) * .08 + Math.sin(t * .031) * .05;
    const core = ctx.createRadialGradient(light.x, light.y, 0, light.x, light.y, 18 * flick);
    core.addColorStop(0, `rgba(255,246,228,${theme.dark ? .95 : .85})`);
    core.addColorStop(.4, `rgba(${theme.glow},.55)`);
    core.addColorStop(1, `rgba(${theme.glow},0)`);
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(light.x, light.y, 18 * flick, 0, 6.283); ctx.fill();

    // motes
    for (const m of motes) {
      const dx = light.x - m.x, dy = light.y - m.y, d = Math.hypot(dx, dy) || 1;
      const heat = 1 - smooth(R * .15, R * .9, d);
      m.heat += (heat - m.heat) * .05;
      if (!reduce) {
        m.vx += (dx / d) * .004 * m.heat + (Math.random() - .5) * .01;
        m.vy += (dy / d) * .004 * m.heat - .002 * m.heat + (Math.random() - .5) * .01;
        m.vx *= .985; m.vy *= .985;
        m.x += m.vx; m.y += m.vy;
      }
      if (m.x < -10) m.x = W + 10; if (m.x > W + 10) m.x = -10;
      if (m.y < -10) m.y = H + 10; if (m.y > H + 10) m.y = -10;
      const tw = .5 + .5 * Math.sin(t * .002 + m.ph);
      const col = m.heat > .05 ? theme.glow : theme.mote;
      ctx.fillStyle = `rgba(${col},${(.18 + m.heat * .7) * (.6 + .4 * tw)})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r * (1 + m.heat * 1.2), 0, 6.283); ctx.fill();
    }

    // rising sparks from the flame
    if (!reduce && Math.random() < .5 + hold) {
      sparks.push({ x: light.x + (Math.random() - .5) * 10, y: light.y, vx: (Math.random() - .5) * .6, vy: -Math.random() * .9 - .3, life: 1, r: Math.random() * 1.6 + .6 });
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx + Math.sin(s.life * 9 + i) * .25; s.y += s.vy; s.life -= .012;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(${theme.glow},${s.life * .8})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * s.life, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
