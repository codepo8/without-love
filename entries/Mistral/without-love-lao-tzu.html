<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Without Love… — Lao Tzu</title>
<style>
  :root { --ink: #f4efe6; --gold: #e8b45a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 120%, #1b1430 0%, #0c0918 55%, #05040d 100%);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    cursor: pointer;
  }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption {
    position: absolute; left: 0; right: 0; text-align: center;
    pointer-events: none; letter-spacing: .04em;
  }
  #phrase {
    top: 16%;
    font-size: clamp(15px, 2.4vw, 24px);
    font-style: italic;
    color: rgba(244,239,230,.55);
    opacity: 0; transition: opacity 1.2s ease;
  }
  #phrase em { color: var(--gold); font-style: normal; }
  #byline {
    bottom: 8%;
    font-size: clamp(13px, 1.6vw, 18px);
    letter-spacing: .35em; text-transform: uppercase;
    color: rgba(232,180,90,.65);
    opacity: .85;
  }
  #byline::before, #byline::after {
    content: "—"; margin: 0 .8em; color: rgba(232,180,90,.35);
  }
  #hint {
    position: absolute; bottom: 3%; left: 0; right: 0; text-align: center;
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(244,239,230,.28); pointer-events: none;
  }
  #progress {
    position: absolute; top: 0; left: 0; height: 2px;
    background: linear-gradient(90deg, rgba(232,180,90,.9), rgba(232,180,90,.3));
    width: 0%; pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="progress"></div>
  <div id="phrase" class="caption"></div>
  <div id="byline" class="caption">Lao Tzu</div>
  <div id="hint">click or press space to continue</div>
</div>
<script>
(() => {
  const PAIRS = [
    ["Duty","irritation"],["Responsibility","disrespect"],["Justice","harshness"],
    ["Truth","brutality"],["Education","pedantry"],["Wisdom","cunning"],
    ["Kindness","hypocrisy"],["Order","pettiness"],["Knowledge","dogma"],
    ["Power","violence"],["Honour","arrogance"],["Possession","stinginess"],
    ["Faith","fanaticism"]
  ];
  const HOLD = 2400, MORPH = 1600; // ms

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const phraseEl = document.getElementById('phrase');
  const progressEl = document.getElementById('progress');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', () => { resize(); rebuildTargets(); });

  // --- sample text pixels into particle targets ---
  let particles = [];

  function sample(word, color) {
    const off = document.createElement('canvas');
    const octx = off.getContext('2d');
    let size = Math.min(W / (word.length * 0.72), H * 0.34, 190);
    size = Math.max(size, 40);
    off.width = W; off.height = H;
    octx.font = `700 ${size}px Georgia, serif`;
    octx.textAlign = 'center'; octx.textBaseline = 'middle';
    octx.fillStyle = '#fff';
    octx.fillText(word, W / 2, H / 2);
    const data = octx.getImageData(0, 0, W, H).data;
    const gap = Math.max(3, Math.round(size / 34));
    const pts = [];
    for (let y = 0; y < H; y += gap)
      for (let x = 0; x < W; x += gap)
        if (data[(y * W + x) * 4 + 3] > 128)
          pts.push({ x, y, color });
    return pts;
  }

  let idx = -1, phase = 'hold', phaseStart = 0, target = [], targetColor = '';

  const COLORS = { virtue: '#f4efe6', vice: '#c8503c' };

  function setParticlesTo(pts) {
    // grow/shrink particle pool to match target size
    while (particles.length < pts.length) particles.push(mkParticle());
    if (particles.length > pts.length) particles.length = pts.length;
  }

  function mkParticle() {
    return {
      x: W / 2 + (Math.random() - .5) * W, y: H / 2 + (Math.random() - .5) * H,
      tx: 0, ty: 0, sx: 0, sy: 0, size: Math.random() * 1.6 + 1,
      color: COLORS.virtue, swirl: Math.random() * Math.PI * 2,
      delay: Math.random()
    };
  }

  function rebuildTargets() {
    if (idx < 0) return;
    target = sample(PAIRS[idx][phase === 'hold' ? 0 : 1], phase === 'hold' ? COLORS.virtue : COLORS.vice);
    // re-assign targets to existing particles (shuffle for organic motion)
    const shuffled = target.slice().sort(() => Math.random() - .5);
    setParticlesTo(shuffled);
    particles.forEach((p, i) => {
      p.sx = p.x; p.sy = p.y;
      p.tx = shuffled[i].x; p.ty = shuffled[i].y;
      p.color = shuffled[i].color;
      p.delay = Math.random() * .4;
    });
  }

  function show(i) {
    idx = (i + PAIRS.length) % PAIRS.length;
    phase = 'hold'; phaseStart = performance.now();
    phraseEl.innerHTML = `<em>${PAIRS[idx][0]}</em> without love is`;
    phraseEl.style.opacity = 1;
    targetColor = COLORS.virtue;
    rebuildTargets();
    // if pool empty (first run), snap particles onto word
    particles.forEach(p => { p.x = p.tx + (Math.random()-.5)*30; p.y = p.ty + (Math.random()-.5)*30; });
  }

  function advance() {
    if (phase === 'hold') {
      phase = 'morph'; phaseStart = performance.now();
      targetColor = COLORS.vice;
      const pts = sample(PAIRS[idx][1], COLORS.vice);
      const shuffled = pts.slice().sort(() => Math.random() - .5);
      setParticlesTo(shuffled);
      particles.forEach((p, i) => {
        p.sx = p.x; p.sy = p.y;
        p.tx = shuffled[i].x; p.ty = shuffled[i].y;
        p.color = shuffled[i].color;
        p.delay = Math.random() * .4;
      });
      phraseEl.innerHTML = `<em>${PAIRS[idx][0]}</em> without love is`;
    } else {
      show(idx + 1);
    }
  }

  // --- render loop ---
  let last = performance.now();
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;

  function frame(now) {
    const dt = Math.min(now - last, 50); last = now;
    const elapsed = now - phaseStart;

    // auto-advance
    if (elapsed > HOLD && phase === 'hold') advance();
    else if (phase === 'morph' && elapsed > MORPH + 900) show(idx + 1);

    const total = PAIRS.length * (HOLD + MORPH);
    progressEl.style.width = (100 * ((idx * (HOLD + MORPH) + Math.min(elapsed, HOLD + MORPH)) / total)) + '%';

    ctx.clearRect(0, 0, W, H);

    const t = phase === 'morph' ? Math.min(elapsed / MORPH, 1) : 0;

    for (const p of particles) {
      if (phase === 'morph') {
        const k = ease(Math.max(0, Math.min((t - p.delay*.25) / .75, 1)));
        const swirlAmp = Math.sin(k * Math.PI) * 90;
        const ang = p.swirl + k * 5;
        p.x = p.sx + (p.tx - p.sx) * k + Math.cos(ang) * swirlAmp;
        p.y = p.sy + (p.ty - p.sy) * k + Math.sin(ang) * swirlAmp;
      } else {
        // gentle idle float
        p.x += Math.cos(p.swirl + now / 1400) * 0.12;
        p.y += Math.sin(p.swirl * 1.3 + now / 1700) * 0.12;
        // drift back toward home
        p.x += (p.tx - p.x) * 0.06;
        p.y += (p.ty - p.y) * 0.06;
        p.sx = p.x; p.sy = p.y;
      }
      ctx.globalAlpha = .9;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  // --- interaction ---
  document.body.addEventListener('click', advance);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowRight') { e.preventDefault(); advance(); }
    if (e.code === 'ArrowLeft') { e.preventDefault(); show(idx - 1); }
  });

  resize();
  show(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
